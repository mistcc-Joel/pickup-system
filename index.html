<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>超時保育簽名系統</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', '微軟正黑體', sans-serif; background: #eef2f5; margin: 0; padding: 10px; color: #333; }
    .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); display: none; }
    h1 { text-align: center; color: #2c3e50; font-size: 26px; margin-top: 0; margin-bottom: 25px;}
    
    #login-screen { max-width: 400px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); text-align: center; }
    #login-screen h2 { color: #2c3e50; margin-bottom: 20px; }
    #pin-input { width: 100%; padding: 15px; font-size: 24px; text-align: center; letter-spacing: 5px; margin-bottom: 20px; border: 2px solid #cbd5e1; border-radius: 8px; }
    
    .nav { display: flex; gap: 10px; margin-bottom: 25px; }
    .nav button { flex: 1; padding: 15px 5px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; background: #e0e6ed; color: #5c6a79; transition: 0.2s; }
    .nav button.active { background: #3498db; color: #fff; box-shadow: 0 4px 6px rgba(52,152,219,0.3); }
    
    .form-label { font-size: 16px; color: #555; font-weight: bold; margin-bottom: 8px; display: block; }
    input[type="text"], input[type="date"] { width: 100%; padding: 16px; margin-bottom: 15px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 18px; }
    
    .btn { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-primary { background: #2ecc71; color: white; }
    .btn-secondary { background: #f1f5f8; color: #64748b; font-size: 18px; }
    .btn-purple { background: #9b59b6; color: white; margin-bottom: 15px; }
    
    .result-card { padding: 18px; background: #fff; border: 2px solid #e2e8f0; margin-bottom: 12px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; color: #334155; }
    
    .info-card { background: #f0f9ff; border: 2px solid #bae6fd; border-radius: 10px; padding: 20px; text-align: center; margin-bottom: 20px; }
    .info-card .name { font-size: 28px; color: #0f172a; font-weight: bold; margin-bottom: 10px; }
    .info-card .time { font-size: 22px; color: #e11d48; font-weight: bold; background: #ffe4e6; display: inline-block; padding: 5px 15px; border-radius: 20px; }

    .canvas-container { position: relative; margin-bottom: 15px; }
    .canvas-hint { position: absolute; top: 10px; left: 10px; color: #94a3b8; font-size: 16px; pointer-events: none; }
    #signature-pad { border: 2px dashed #94a3b8; border-radius: 10px; background: #fafafa; cursor: crosshair; touch-action: none; width: 100%; height: 260px; }
    
    .section { display: none; }
    .section.active { display: block; }
    
    #qr-reader-container { display: none; margin-bottom: 15px; border: 2px solid #cbd5e1; border-radius: 10px; padding: 10px; background: #fff;}
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }

    .table-responsive { width: 100%; overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
    table { width: 100%; min-width: 550px; border-collapse: collapse; background: #fff; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 12px 10px; text-align: center; font-size: 16px; }
    th { background: #f8fafc; color: #475569; white-space: nowrap; }
    .sign-img { max-height: 50px; object-fit: contain; }

    /* 🌟 全螢幕載入動畫遮罩樣式 */
    #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; color: white; font-size: 20px; font-weight: bold; }
    .spinner { border: 6px solid #f3f3f3; border-top: 6px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="login-screen">
  <h2>🔒 系統已鎖定</h2>
  <p style="color:#7f8c8d; margin-bottom:20px;">請輸入教師通關密碼</p>
  <input type="text" id="pin-input" placeholder="請輸入密碼" autocomplete="off" oninput="handlePinInput(event)" onkeypress="if(event.key === 'Enter') verifyPin()" style="font-size: 24px; text-align: center; letter-spacing: 3px;">
  <button class="btn btn-primary" onclick="verifyPin()">解鎖系統</button>
  <div id="login-msg" style="color:#e74c3c; margin-top:15px; font-weight:bold;"></div>
</div>

<div class="container" id="app-container">
  <h1>🕒 超時保育管理系統</h1>
  
  <div class="nav">
    <button id="tab-sign" class="active" onclick="switchTab('sign')">📝 家長簽名</button>
    <button id="tab-list" onclick="switchTab('list'); fetchRecentRecords();">📋 近期清單</button>
    <button id="tab-report" onclick="switchTab('report')">🖨️ 列印報表</button>
  </div>

  <div id="section-sign" class="section active">
    <div id="step-search">
      <label class="form-label">📷 即時相機掃描 QR Code</label>
      <button id="start-scan-btn" class="btn btn-purple" onclick="startScanner()">📷 啟動掃描鏡頭</button>
      
      <div id="qr-reader-container">
        <div id="reader"></div>
        <button class="btn btn-secondary" style="margin-top:15px;" onclick="stopScanner()">❌ 關閉相機</button>
      </div>

      <div style="text-align:center; margin: 25px 0; color: #94a3b8; font-weight:bold;">--- 或手動輸入 ---</div>
      <label class="form-label">🔍 查詢學童 (可輸入學號、姓名)</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="keyword" placeholder="輸入後按 Enter..." onkeypress="if(event.key === 'Enter') search()" style="margin-bottom:0;">
        <button class="btn btn-primary" style="width: 100px;" onclick="search()">查詢</button>
      </div>
      <div id="search-results" style="margin-top: 20px;"></div>
    </div>

    <div id="step-signature" style="display:none;">
      <div class="info-card">
        <div class="name" id="display-name"></div>
        <div class="time" id="display-time"></div>
      </div>
      <div class="canvas-container">
        <div class="canvas-hint">請在此框內簽名...</div>
        <canvas id="signature-pad"></canvas>
      </div>
      <button class="btn btn-primary" id="submit-btn" onclick="submitSignature()">✅ 確認簽名送出</button>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn btn-secondary" style="width:50%" onclick="clearCanvas()">🗑️ 清除重簽</button>
        <button class="btn btn-secondary" style="width:50%" onclick="backToSearch()">返回上一步</button>
      </div>
    </div>
  </div>

  <div id="section-list" class="section">
    <button class="btn btn-secondary" style="margin-bottom: 15px;" onclick="fetchRecentRecords()">🔄 重新整理</button>
    <div class="table-responsive" id="list-content">資料載入中...</div>
  </div>

  <div id="section-report" class="section">
    <input type="date" id="report-date" style="margin-bottom: 10px;">
    <button class="btn btn-primary" style="margin-bottom: 20px;" onclick="fetchReport()">產生報表</button>
    <div id="report-content"></div>
  </div>
</div>

<!-- 🌟 全螢幕載入動畫 HTML -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <div id="loading-text">正在查詢學童資料...</div>
</div>

<script>
  // ⚠️ 請確認這裡的 GAS 網址是否正確
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyTbufOyqkkVxTnDbOReNbspnxkUv2chfN9RmmQKF0cEfw3eySM7OEdmV2nn0THsdBMrA/exec";
  
  let currentPin = ""; 
  let html5QrcodeScanner = null;
  let selectedStudent = null;
  const canvas = document.getElementById('signature-pad');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;

  async function apiCall(action, data = {}) {
    try {
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
        body: JSON.stringify({ action: action, pin: currentPin, ...data })
      });
      const result = await response.json();
      if (!result.success && result.message.includes("PIN")) {
        alert("🔒 登入逾時或密碼錯誤，請重新登入！");
        location.reload();
      }
      return result;
    } catch (err) {
      alert("連線到資料庫失敗，請檢查網路連線。");
      return { success: false, message: "連線失敗" };
    }
  }

  async function verifyPin() {
    const pin = document.getElementById('pin-input').value;
    if(!pin) return;
    document.getElementById('login-msg').innerText = "驗證中，請稍候...";
    
    currentPin = pin;
    const res = await apiCall('verifyPin');
    
    if (res.success) {
      document.getElementById('login-screen').style.display = "none";
      document.getElementById('app-container').style.display = "block";
    } else {
      document.getElementById('login-msg').innerText = res.message;
      currentPin = "";
    }
  }

  function switchTab(tab) {
    stopScanner();
    ['sign', 'list', 'report'].forEach(t => {
      document.getElementById('tab-' + t).classList.remove('active');
      document.getElementById('section-' + t).classList.remove('active');
    });
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('section-' + tab).classList.add('active');
  }

  function startScanner() {
    document.getElementById('start-scan-btn').style.display = 'none';
    document.getElementById('qr-reader-container').style.display = 'block';
    
    if (!html5QrcodeScanner) {
      // 🌟 調整掃描設定：放大掃描框，並支援全畫面快速辨識
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
        fps: 20,                          // 提高每秒偵測格數，反應更靈敏
        qrbox: { width: 320, height: 320 }, // 放大掃描框尺寸 (原本通常是 250x250)
        aspectRatio: 1.0,
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true // 啟用瀏覽器原生加速辨識，大幅提升對準速度
        }
      }, false);
      
      html5QrcodeScanner.render(onScanSuccess, (err)=>{});
    }
  }

  function stopScanner() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.clear();
      html5QrcodeScanner = null;
    }
    document.getElementById('qr-reader-container').style.display = 'none';
    document.getElementById('start-scan-btn').style.display = 'block';
  }

  async function onScanSuccess(decodedText) {
    stopScanner();
    
    // 🌟 顯示全螢幕載入動畫
    document.getElementById('loading-text').innerText = "🔄 掃描成功！正在查詢學童資料...";
    document.getElementById('loading-overlay').style.display = "flex";

    try {
      const qrData = JSON.parse(decodedText);
      if (qrData._membrId) {
        const res = await apiCall('searchMembrId', { membrId: qrData._membrId });
        
        // 🌟 關閉載入動畫
        document.getElementById('loading-overlay').style.display = "none";
        
        showResults(res.data);
      } else {
        document.getElementById('loading-overlay').style.display = "none";
        alert("⚠️ 無效的 QR Code 格式");
      }
    } catch(e) {
      document.getElementById('loading-overlay').style.display = "none";
      alert("⚠️ 無效的 QR Code 格式");
    }
  }

  async function search() {
    const keyword = document.getElementById('keyword').value.trim();
    if (!keyword) return alert("請輸入關鍵字");
    document.getElementById('keyword').blur();
    
    // 🌟 一般搜尋也加上載入動畫
    document.getElementById('loading-text').innerText = "🔍 正在搜尋學童...";
    document.getElementById('loading-overlay').style.display = "flex";
    
    const res = await apiCall('search', { keyword: keyword });
    
    document.getElementById('loading-overlay').style.display = "none";
    if(res.success) showResults(res.data);
  }

  function showResults(results) {
    const container = document.getElementById('search-results');
    if (!results || results.length === 0) return container.innerHTML = "<div style='color:#e11d48; text-align:center;'>找不到符合的學童</div>";
    
    if (results.length === 1) {
      return selectStudent(JSON.stringify(results[0]));
    }
    
    let html = "";
    results.forEach(s => {
      html += `<div class="result-card" onclick="selectStudent('${JSON.stringify(s).replace(/"/g, '&quot;')}')">
                 <div>${s.className} - <span style="color:#0284c7; font-size:22px;">${s.name}</span><div class="result-sub">學號: ${s.studentId}</div></div>
                 <div>❯</div></div>`;
    });
    container.innerHTML = html;
  }

  function selectStudent(studentJson) {
    selectedStudent = JSON.parse(studentJson);
    document.getElementById('step-search').style.display = "none";
    document.getElementById('step-signature').style.display = "block";
    document.getElementById('display-name').innerText = `${selectedStudent.className} - ${selectedStudent.name}`;
    
    const now = new Date();
    document.getElementById('display-time').innerText = `時間：${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    setTimeout(resizeCanvas, 100); 
  }

  function backToSearch() {
    selectedStudent = null;
    document.getElementById('step-search').style.display = "block";
    document.getElementById('step-signature').style.display = "none";
    document.getElementById('keyword').value = "";
    document.getElementById('search-results').innerHTML = "";
  }

  function resizeCanvas() {
    const ratio = Math.max(window.devicePixelRatio || 1, 1);
    canvas.width = canvas.offsetWidth * ratio;
    canvas.height = canvas.offsetHeight * ratio;
    ctx.scale(ratio, ratio);
    clearCanvas();
  }
  function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  function startDrawing(e) { e.preventDefault(); isDrawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.strokeStyle = "#1e293b"; }
  function draw(e) { if (!isDrawing) return; e.preventDefault(); ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); }
  function stopDrawing(e) { if(e) e.preventDefault(); isDrawing = false; }
  canvas.addEventListener('mousedown', startDrawing); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseup', stopDrawing); canvas.addEventListener('mouseout', stopDrawing);
  canvas.addEventListener('touchstart', startDrawing, {passive: false}); canvas.addEventListener('touchmove', draw, {passive: false}); canvas.addEventListener('touchend', stopDrawing);

  async function submitSignature() {
    const blank = document.createElement('canvas'); blank.width = canvas.width; blank.height = canvas.height;
    if (canvas.toDataURL() === blank.toDataURL()) return alert("⚠️ 請家長先在方框內簽名！");

    const base64Image = canvas.toDataURL('image/png');
    
    // 🌟 儲存時也顯示載入動畫
    document.getElementById('loading-text').innerText = "⏳ 正在儲存簽名與紀錄...";
    document.getElementById('loading-overlay').style.display = "flex";

    const res = await apiCall('save', { studentData: selectedStudent, base64Image: base64Image });
    
    document.getElementById('loading-overlay').style.display = "none";
    alert(res.message);
    if(res.success) backToSearch();
  }

  async function fetchRecentRecords() {
    document.getElementById('loading-text').innerText = "📋 載入近期清單...";
    document.getElementById('loading-overlay').style.display = "flex";
    
    const res = await apiCall('recent');
    document.getElementById('loading-overlay').style.display = "none";
    
    if(res.success) {
      if (res.data.length === 0) return document.getElementById('list-content').innerHTML = "<div style='padding:20px; text-align:center;'>無紀錄。</div>";
      let html = `<table><tr><th>時間</th><th>班級</th><th>姓名</th><th>簽名</th></tr>`;
      res.data.forEach(r => { html += `<tr><td>${r.datetime}</td><td>${r.className}</td><td>${r.name}</td><td><img src="${r.imgUrl}" class="sign-img"></td></tr>`; });
      document.getElementById('list-content').innerHTML = html + `</table>`;
    }
  }

  document.getElementById('report-date').valueAsDate = new Date();
  async function fetchReport() {
    const targetDate = document.getElementById('report-date').value;
    if (!targetDate) return alert("請選擇日期");
    
    document.getElementById('loading-text').innerText = "📊 產生報表中...";
    document.getElementById('loading-overlay').style.display = "flex";
    
    const res = await apiCall('report', { targetDate: targetDate });
    document.getElementById('loading-overlay').style.display = "none";
    
    if(res.success) {
      if (res.data.length === 0) return document.getElementById('report-content').innerHTML = "<div style='padding:20px; text-align:center;'>這天沒有紀錄。</div>";
      let html = `<button class="btn btn-secondary" style="margin-bottom:15px;" onclick="window.print()">🖨️ 列印此頁</button>`;
      html += `<h2 style="text-align:center;">超時接回清冊 (${targetDate})</h2>`;
      html += `<div class="table-responsive"><table><tr><th>時間</th><th>班級</th><th>學號</th><th>姓名</th><th>簽名</th></tr>`;
      res.data.forEach(r => { html += `<tr><td>${r.time}</td><td>${r.className}</td><td>${r.studentId}</td><td>${r.name}</td><td><img src="${r.imgUrl}" class="sign-img"></td></tr>`; });
      document.getElementById('report-content').innerHTML = html + `</table></div>`;
    }
  }

// 🌟 密碼 1 秒後自動轉為 * 的特效邏輯
  let realPinValue = ""; // 用來在背景默默儲存老師真正打的字
  let hideTimeouts = {}; // 用來追蹤每個字元的計時器

  function handlePinInput(e) {
    const inputField = document.getElementById('pin-input');
    const val = inputField.value;
    
    // 判斷使用者是新增字元還是刪除字元
    if (val.length > realPinValue.length) {
      // 取得剛才最新輸入的那一個字元
      const newChar = val[val.length - 1];
      realPinValue += newChar; // 把真實字元存進背景變數
      
      const indexToHide = realPinValue.length - 1;
      
      // ⏱️ 關鍵特效：設定 1 秒後將該位置的字元變成 *
      hideTimeouts[indexToHide] = setTimeout(() => {
        let masked = "";
        for (let i = 0; i < realPinValue.length; i++) {
          if (i <= indexToHide) {
            masked += "•"; // 變成黑點 (或 * )
          } else {
            masked += realPinValue[i];
          }
        }
        inputField.value = masked;
      }, 1000); // 1000 毫秒 = 1 秒
      
    } else if (val.length < realPinValue.length) {
      // 如果老師按了退格鍵 (Backspace) 刪除字元
      realPinValue = realPinValue.substring(0, val.length);
      // 清除所有殘留的計時器
      Object.values(hideTimeouts).forEach(t => clearTimeout(t));
      hideTimeouts = {};
    }
  }

  // 修改原本的 verifyPin 函數，讓它去抓取背景中「真正的密碼」來驗證
  async function verifyPin() {
    const pin = realPinValue; // 抓取真實密碼
    if(!pin) return;
    document.getElementById('login-msg').innerText = "驗證中，請稍候...";
    
    currentPin = pin;
    const res = await apiCall('verifyPin');
    
    if (res.success) {
      document.getElementById('login-screen').style.display = "none";
      document.getElementById('app-container').style.display = "block";
    } else {
      document.getElementById('login-msg').innerText = res.message;
      currentPin = "";
      realPinValue = "";
      document.getElementById('pin-input').value = "";
    }
  }
  
</script>
</body>
</html>
